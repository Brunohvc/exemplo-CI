on:
  push:
    branches:
      - main
      - homolog
  pull_request:
    branches:
      - main
      - homolog
  workflow_dispatch:
    inputs:
      bump:
        description: "Incremento de versão aplicado antes do deploy de produção"
        type: choice
        default: "patch (0.0.x)"
        options:
          - "patch (0.0.x)"
          - "minor (0.x.0)"
          - "major (x.0.0)"
          - "skip (mantém a versão atual)"

name: Standard

concurrency:
  group: standard-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/homolog' }}

permissions:
  contents: write

jobs:
  ci:
    name: CI - Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn
      - name: Install Dependencies
        run: yarn install --frozen-lockfile
      - name: Lint App
        run: yarn lint
      - name: Test App
        run: yarn test
      - name: Build App
        run: yarn build
  ci_docker:
    name: CI - Docker
    if: ${{ github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Docker Build
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          docker build -f dockerfiles/Dockerfile -t exemplo-ci:"$VERSION" .
          echo "Imagem construída: exemplo-ci:$VERSION" >> "$GITHUB_STEP_SUMMARY"
  cd_hml:
    name: CD - hml
    if: ${{ success() && github.ref == 'refs/heads/homolog' && github.actor != 'dependabot[bot]' }}
    needs: [ci, ci_docker]
    runs-on: ubuntu-latest
    environment:
      name: hml
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Deploy App
        run: node scripts/deploy.mjs hml
  bump_plan:
    name: Bump Plan
    if: ${{ success() && github.ref == 'refs/heads/main' && github.actor != 'dependabot[bot]' }}
    needs: [ci]
    runs-on: ubuntu-latest
    outputs:
      input_type: ${{ steps.plan.outputs.input_type }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Plan Bump
        id: plan
        env:
          INPUT_BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          INPUT_TYPE=""
          if [ -n "${INPUT_BUMP:-}" ]; then
            INPUT_TYPE="$(printf '%s' "$INPUT_BUMP" | cut -d' ' -f1)"
            case "$INPUT_TYPE" in
              patch|minor|major|skip) ;;
              *) echo "::error::tipo de bump invalido: $INPUT_TYPE"; exit 1 ;;
            esac
          fi
          ATUAL="$(node -p "require('./package.json').version")"
          echo "input_type=$INPUT_TYPE" >> "$GITHUB_OUTPUT"
          {
            echo "## Escolha do incremento"
            echo
            echo "Versão atual: \`$ATUAL\`"
            echo
            echo "| aprove este environment | incremento | versão resultante |"
            echo "| --- | --- | --- |"
            for T in patch minor major; do
              echo "| \`bump-$T\` | $T | \`$(node scripts/next-version.mjs "$T")\` |"
            done
            echo
            if [ -n "$INPUT_TYPE" ]; then
              echo "Run workflow pediu \`$INPUT_TYPE\` — só esse environment será aberto para aprovação."
            else
              echo "Abra **Review deployments**, marque **apenas um** environment e clique"
              echo "**Approve and deploy**. Depois marque os outros dois e clique **Reject** para liberar o release."
              echo "Aprovar mais de um incremento faz o release falhar."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
  bump_patch:
    name: Bump - patch
    if: ${{ success() && (needs.bump_plan.outputs.input_type == '' || needs.bump_plan.outputs.input_type == 'patch') }}
    needs: [ci, bump_plan]
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: bump-patch
    outputs:
      approved: ${{ steps.approve.outputs.approved }}
    steps:
      - name: Approved
        id: approve
        run: |
          echo "approved=patch" >> "$GITHUB_OUTPUT"
          echo "incremento patch aprovado" >> "$GITHUB_STEP_SUMMARY"
      - name: Reject Others
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          APROVADO: patch
          URL: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/pending_deployments
        if: ${{ env.GH_TOKEN != '' }}
        run: |
          set -euo pipefail
          IDS="$(gh api "$URL" --jq '[.[].environment.id]')"
          if [ "$IDS" = "[]" ]; then
            echo "nenhuma pendencia restante"
            exit 0
          fi
          printf '{"environment_ids":%s,"state":"rejected","comment":"%s aprovado; demais incrementos rejeitados automaticamente"}' \
            "$IDS" "$APROVADO" \
            | gh api -X POST "$URL" --input - >/dev/null \
            || echo "::warning::nao foi possivel rejeitar as pendencias restantes"
  bump_minor:
    name: Bump - minor
    if: ${{ success() && (needs.bump_plan.outputs.input_type == '' || needs.bump_plan.outputs.input_type == 'minor') }}
    needs: [ci, bump_plan]
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: bump-minor
    outputs:
      approved: ${{ steps.approve.outputs.approved }}
    steps:
      - name: Approved
        id: approve
        run: |
          echo "approved=minor" >> "$GITHUB_OUTPUT"
          echo "incremento minor aprovado" >> "$GITHUB_STEP_SUMMARY"
      - name: Reject Others
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          APROVADO: minor
          URL: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/pending_deployments
        if: ${{ env.GH_TOKEN != '' }}
        run: |
          set -euo pipefail
          IDS="$(gh api "$URL" --jq '[.[].environment.id]')"
          if [ "$IDS" = "[]" ]; then
            echo "nenhuma pendencia restante"
            exit 0
          fi
          printf '{"environment_ids":%s,"state":"rejected","comment":"%s aprovado; demais incrementos rejeitados automaticamente"}' \
            "$IDS" "$APROVADO" \
            | gh api -X POST "$URL" --input - >/dev/null \
            || echo "::warning::nao foi possivel rejeitar as pendencias restantes"
  bump_major:
    name: Bump - major
    if: ${{ success() && (needs.bump_plan.outputs.input_type == '' || needs.bump_plan.outputs.input_type == 'major') }}
    needs: [ci, bump_plan]
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: bump-major
    outputs:
      approved: ${{ steps.approve.outputs.approved }}
    steps:
      - name: Approved
        id: approve
        run: |
          echo "approved=major" >> "$GITHUB_OUTPUT"
          echo "incremento major aprovado" >> "$GITHUB_STEP_SUMMARY"
      - name: Reject Others
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          APROVADO: major
          URL: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/pending_deployments
        if: ${{ env.GH_TOKEN != '' }}
        run: |
          set -euo pipefail
          IDS="$(gh api "$URL" --jq '[.[].environment.id]')"
          if [ "$IDS" = "[]" ]; then
            echo "nenhuma pendencia restante"
            exit 0
          fi
          printf '{"environment_ids":%s,"state":"rejected","comment":"%s aprovado; demais incrementos rejeitados automaticamente"}' \
            "$IDS" "$APROVADO" \
            | gh api -X POST "$URL" --input - >/dev/null \
            || echo "::warning::nao foi possivel rejeitar as pendencias restantes"
  version_bump:
    name: Version Bump
    if: ${{ always() && github.ref == 'refs/heads/main' && github.actor != 'dependabot[bot]' && needs.ci.result == 'success' && needs.bump_plan.result == 'success' && (needs.bump_plan.outputs.input_type == 'skip' || needs.bump_patch.outputs.approved != '' || needs.bump_minor.outputs.approved != '' || needs.bump_major.outputs.approved != '') }}
    needs: [ci, bump_plan, bump_patch, bump_minor, bump_major]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Bump Version
        id: bump
        env:
          INPUT_TYPE: ${{ needs.bump_plan.outputs.input_type }}
          A_PATCH: ${{ needs.bump_patch.outputs.approved }}
          A_MINOR: ${{ needs.bump_minor.outputs.approved }}
          A_MAJOR: ${{ needs.bump_major.outputs.approved }}
        run: |
          set -euo pipefail
          if [ "$INPUT_TYPE" = "skip" ]; then
            TYPE="skip"
          else
            APROVADOS="$(printf '%s %s %s' "$A_PATCH" "$A_MINOR" "$A_MAJOR" | tr -s ' ')"
            APROVADOS="$(printf '%s' "$APROVADOS" | sed 's/^ *//; s/ *$//')"
            TOTAL="$(printf '%s' "$APROVADOS" | wc -w | tr -d ' ')"
            if [ "$TOTAL" -eq 0 ]; then
              echo "::error::nenhum incremento foi aprovado"
              exit 1
            fi
            if [ "$TOTAL" -gt 1 ]; then
              echo "::error::mais de um incremento aprovado ($APROVADOS) — aprove apenas um environment de bump e rejeite os outros"
              {
                echo "## ❌ Release cancelado"
                echo
                echo "Foram aprovados **$TOTAL** incrementos: \`$APROVADOS\`."
                echo "Aprove apenas um environment de bump e rejeite os outros dois."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            TYPE="$APROVADOS"
          fi
          echo "Bump: $TYPE" >> "$GITHUB_STEP_SUMMARY"
          if [ "$TYPE" = "skip" ]; then
            echo "version=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VERSION=$(npm version "$TYPE" --no-git-tag-version --ignore-scripts)
          git add package.json
          git commit -m "chore(release): $VERSION [skip ci]"
          git tag -a "$VERSION" -m "$VERSION"
          git push origin "HEAD:${{ github.ref_name }}" --follow-tags
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Versão publicada: $VERSION" >> "$GITHUB_STEP_SUMMARY"
  ci_docker_release:
    name: CI - Docker (release)
    if: ${{ success() && github.ref == 'refs/heads/main' }}
    needs: [version_bump]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version_bump.outputs.sha }}
      - name: Docker Build
        env:
          VERSION: ${{ needs.version_bump.outputs.version }}
        run: |
          set -euo pipefail
          docker build -f dockerfiles/Dockerfile -t exemplo-ci:"${VERSION#v}" .
          echo "Imagem de release construída: exemplo-ci:${VERSION#v}" >> "$GITHUB_STEP_SUMMARY"
  cd_prd:
    name: CD - prd
    if: ${{ success() && github.ref == 'refs/heads/main' }}
    needs: [version_bump, ci_docker_release]
    runs-on: ubuntu-latest
    environment:
      name: prd
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version_bump.outputs.sha }}
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Deploy App
        run: node scripts/deploy.mjs prd
